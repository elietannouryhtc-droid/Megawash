<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="navEmployees">Employees - Car Wash Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <div class="brand-logo">CW</div>
        <h2 class="brand-name" data-i18n="appName">Car Wash Portal</h2>
      </div>
      <ul class="sidebar-nav">
        <li><a href="dashboard.html" class="sidebar-link" id="nav-dash"><span data-i18n="navDashboard">Dashboard</span></a></li>
        <li><a href="employees.html" class="sidebar-link active" id="nav-emp"><span data-i18n="navEmployees">Employees</span></a></li>
        <li><a href="timesheets.html" class="sidebar-link" id="nav-time"><span data-i18n="navTimesheets">Timesheets</span></a></li>
        <li><a href="payroll.html" class="sidebar-link" id="nav-pay"><span data-i18n="navPayroll">Payroll</span></a></li>
        <li><a href="advances.html" class="sidebar-link" id="nav-adv"><span data-i18n="navAdvances">Salary Advances</span></a></li>
        <li><a href="reports.html" class="sidebar-link" id="nav-rep"><span data-i18n="navReports">Reports</span></a></li>
        <li><a href="audit.html" class="sidebar-link" id="nav-audit"><span data-i18n="navAudit">Audit Logs</span></a></li>
        <li><a href="settings.html" class="sidebar-link" id="nav-set"><span data-i18n="navSettings">Settings</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" id="logoutBtn" style="width: 100%;">
          <span data-i18n="logout">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-content">
      <!-- Header -->
      <header class="content-header">
        <div style="display:flex; align-items:center; gap: 1rem;">
          <button class="mobile-nav-toggle" id="menuToggle">&#9776;</button>
          <h1 class="page-title" data-i18n="empTitle">Employee Management</h1>
        </div>
        <div class="header-controls">
          <button class="btn btn-primary btn-sm" id="btnAddEmployee">
            + <span data-i18n="addEmpBtn">Add New Employee</span>
          </button>
          <button class="lang-toggle-btn" id="languageToggle">FR</button>
        </div>
      </header>

      <!-- Search & Filters -->
      <div class="glass-panel filter-bar">
        <div class="filter-inputs" style="width:100%;">
          <input type="text" id="searchEmployee" class="form-control" data-i18n-placeholder="search" placeholder="Search..." style="flex-grow:1; max-width: 400px;">
        </div>
      </div>

      <!-- Employees List -->
      <div class="glass-panel" style="padding: 1rem;">
        <div class="table-container">
          <table class="modern-table">
            <thead>
              <tr>
                <th data-i18n="empNameHeader">Full Name</th>
                <th data-i18n="empRoleHeader">Role</th>
                <th data-i18n="empRateHeader">Hourly Rate</th>
                <th data-i18n="empPinHeader">PIN Code</th>
                <th data-i18n="empStatusHeader">Status</th>
                <th data-i18n="actions" style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="employeesTableBody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted);" data-i18n="loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Employee Modal Dialog -->
  <div class="modal-overlay" id="employeeModal">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle" data-i18n="addEmpBtn">Add New Employee</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="employeeForm">
        <input type="hidden" id="employeeId">
        
        <div class="form-group">
          <label class="form-label" for="empName" data-i18n="empNameHeader">Full Name</label>
          <input type="text" id="empName" class="form-control" required placeholder="e.g. Marie Dupont">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="empRole" data-i18n="empRoleHeader">Role</label>
          <select id="empRole" class="form-control">
            <option value="employee" data-i18n="empRoleEmployee">Employee</option>
            <option value="admin" data-i18n="empRoleAdmin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="empRate" data-i18n="empRateHeader">Hourly Rate</label>
          <input type="number" id="empRate" class="form-control" required min="0" step="0.01" placeholder="15.00">
          <small class="rateHelp" style="color:var(--text-muted); font-size:0.75rem;" data-i18n="rateHelp">Hourly wage in local currency</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="empPin" data-i18n="empPinHeader">PIN Code</label>
          <input type="text" id="empPin" class="form-control" required minlength="4" maxlength="4" pattern="\d{4}" placeholder="1234">
          <small style="color:var(--text-muted); font-size:0.75rem;" data-i18n="pinHelp">4-digit unique numerical code</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="empStatus" data-i18n="empStatusHeader">Status</label>
          <select id="empStatus" class="form-control">
            <option value="true" data-i18n="active">Active</option>
            <option value="false" data-i18n="inactive">Inactive</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancel" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/employees.js"></script>
</body>
</html>
