<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="navTimesheets">Timesheets - Car Wash Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <div class="brand-logo">CW</div>
        <h2 class="brand-name" data-i18n="appName">Car Wash Portal</h2>
      </div>
      <ul class="sidebar-nav">
        <li><a href="dashboard.html" class="sidebar-link" id="nav-dash"><span data-i18n="navDashboard">Dashboard</span></a></li>
        <li><a href="employees.html" class="sidebar-link" id="nav-emp"><span data-i18n="navEmployees">Employees</span></a></li>
        <li><a href="timesheets.html" class="sidebar-link active" id="nav-time"><span data-i18n="navTimesheets">Timesheets</span></a></li>
        <li><a href="payroll.html" class="sidebar-link" id="nav-pay"><span data-i18n="navPayroll">Payroll</span></a></li>
        <li><a href="advances.html" class="sidebar-link" id="nav-adv"><span data-i18n="navAdvances">Salary Advances</span></a></li>
        <li><a href="reports.html" class="sidebar-link" id="nav-rep"><span data-i18n="navReports">Reports</span></a></li>
        <li><a href="audit.html" class="sidebar-link" id="nav-audit"><span data-i18n="navAudit">Audit Logs</span></a></li>
        <li><a href="settings.html" class="sidebar-link" id="nav-set"><span data-i18n="navSettings">Settings</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" id="logoutBtn" style="width: 100%;">
          <span data-i18n="logout">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-content">
      <!-- Header -->
      <header class="content-header">
        <div style="display:flex; align-items:center; gap: 1rem;">
          <button class="mobile-nav-toggle" id="menuToggle">&#9776;</button>
          <h1 class="page-title" data-i18n="timeTitle">Shift Timesheets</h1>
        </div>
        <div class="header-controls">
          <button class="btn btn-primary btn-sm" id="btnAddShift">
            + <span data-i18n="addShiftBtn">Manual Shift Entry</span>
          </button>
          <button class="lang-toggle-btn" id="languageToggle">FR</button>
        </div>
      </header>

      <!-- Search & Filters -->
      <div class="glass-panel filter-bar">
        <div class="filter-inputs">
          <div class="form-group" style="margin-bottom:0; min-width: 200px;">
            <label class="form-label" for="filterEmp" data-i18n="filterEmployee" style="font-size:0.75rem;">Filter by Employee</label>
            <select id="filterEmp" class="form-control" style="padding: 0.5rem 0.75rem; font-size:0.875rem;">
              <option value="all">-- All Employees --</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0; min-width: 180px;">
            <label class="form-label" for="filterDateInput" data-i18n="filterDate" style="font-size:0.75rem;">Filter by Date</label>
            <input type="date" id="filterDateInput" class="form-control" style="padding: 0.5rem 0.75rem; font-size:0.875rem;">
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" id="btnResetFilters" style="margin-top: auto;">Reset</button>
      </div>

      <!-- Timesheets List -->
      <div class="glass-panel" style="padding: 1rem;">
        <div class="table-container">
          <table class="modern-table">
            <thead>
              <tr>
                <th data-i18n="employeeName">Employee</th>
                <th data-i18n="checkInHeader">Clock-In</th>
                <th data-i18n="checkOutHeader">Clock-Out</th>
                <th data-i18n="totalHoursHeader">Hours</th>
                <th data-i18n="status">Status</th>
                <th data-i18n="actions" style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="timesheetsTableBody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted);" data-i18n="loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Manual Shift Add / Edit Modal -->
  <div class="modal-overlay" id="shiftModal">
    <div class="glass-panel modal-content" style="max-width: 550px;">
      <div class="modal-header">
        <h3 class="modal-title" id="shiftModalTitle" data-i18n="shiftDetails">Shift Details</h3>
        <button class="modal-close" id="shiftModalClose">&times;</button>
      </div>
      <form id="shiftForm">
        <input type="hidden" id="shiftId">
        
        <div class="form-group" id="empSelectGroup">
          <label class="form-label" for="shiftEmployeeId" data-i18n="employeeName">Employee</label>
          <select id="shiftEmployeeId" class="form-control" required></select>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="shiftCheckInDate">Clock-In Date</label>
            <input type="date" id="shiftCheckInDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="shiftCheckInTime">Clock-In Time</label>
            <input type="time" id="shiftCheckInTime" class="form-control" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="shiftCheckOutDate">Clock-Out Date</label>
            <input type="date" id="shiftCheckOutDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="shiftCheckOutTime">Clock-Out Time</label>
            <input type="time" id="shiftCheckOutTime" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="shiftStatus" data-i18n="status">Status</label>
          <select id="shiftStatus" class="form-control">
            <option value="pending" data-i18n="pending">Pending</option>
            <option value="approved" data-i18n="approved">Approved</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnShiftCancel" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/timesheets.js"></script>
</body>
</html>
