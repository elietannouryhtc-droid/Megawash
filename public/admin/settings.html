<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="navSettings">Settings - Car Wash Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <div class="brand-logo">CW</div>
        <h2 class="brand-name" data-i18n="appName">Car Wash Portal</h2>
      </div>
      <ul class="sidebar-nav">
        <li><a href="dashboard.html" class="sidebar-link" id="nav-dash"><span data-i18n="navDashboard">Dashboard</span></a></li>
        <li><a href="employees.html" class="sidebar-link" id="nav-emp"><span data-i18n="navEmployees">Employees</span></a></li>
        <li><a href="timesheets.html" class="sidebar-link" id="nav-time"><span data-i18n="navTimesheets">Timesheets</span></a></li>
        <li><a href="payroll.html" class="sidebar-link" id="nav-pay"><span data-i18n="navPayroll">Payroll</span></a></li>
        <li><a href="advances.html" class="sidebar-link" id="nav-adv"><span data-i18n="navAdvances">Salary Advances</span></a></li>
        <li><a href="reports.html" class="sidebar-link" id="nav-rep"><span data-i18n="navReports">Reports</span></a></li>
        <li><a href="audit.html" class="sidebar-link" id="nav-audit"><span data-i18n="navAudit">Audit Logs</span></a></li>
        <li><a href="settings.html" class="sidebar-link active" id="nav-set"><span data-i18n="navSettings">Settings</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" id="logoutBtn" style="width: 100%;">
          <span data-i18n="logout">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-content">
      <!-- Header -->
      <header class="content-header">
        <div style="display:flex; align-items:center; gap: 1rem;">
          <button class="mobile-nav-toggle" id="menuToggle">&#9776;</button>
          <h1 class="page-title" data-i18n="navSettings">Settings</h1>
        </div>
        <div class="header-controls">
          <button class="lang-toggle-btn" id="languageToggle">FR</button>
        </div>
      </header>

      <!-- Settings Panel Form -->
      <div class="glass-panel" style="max-width: 650px; margin: 0 auto;">
        <h3 style="font-weight: 700; margin-bottom: 0.5rem;" data-i18n="navSettings">System Configurations</h3>
        <p class="form-label" style="margin-bottom: 2rem;" data-i18n="setSubTitle">Configure System Settings</p>
        
        <form id="settingsForm">
          <!-- Company Name -->
          <div class="form-group">
            <label class="form-label" for="setCompanyName" data-i18n="setCompany">Company Name</label>
            <input type="text" id="setCompanyName" class="form-control" required placeholder="e.g. Elite Car Wash">
          </div>

          <div class="form-grid-2col">
            <!-- Currency Symbol -->
            <div class="form-group">
              <label class="form-label" for="setCurrencySymbol" data-i18n="setCurrency">Currency Symbol</label>
              <input type="text" id="setCurrencySymbol" class="form-control" required maxLength="3" placeholder="$">
            </div>

            <!-- Estimated Tax Rate -->
            <div class="form-group">
              <label class="form-label" for="setTaxRateVal" data-i18n="setTaxRate">Estimated Tax Deduction (%)</label>
              <input type="number" id="setTaxRateVal" class="form-control" min="0" max="99" step="0.1" placeholder="15">
            </div>
          </div>

          <div class="form-grid-2col">
            <!-- Overtime Multiplier -->
            <div class="form-group">
              <label class="form-label" for="setOvertimeRateVal" data-i18n="setOvertimeRate">Overtime Rate Multiplier</label>
              <input type="number" id="setOvertimeRateVal" class="form-control" min="1" max="5" step="0.05" placeholder="1.5">
            </div>

            <!-- Overtime Threshold -->
            <div class="form-group">
              <label class="form-label" for="setOvertimeThresholdVal" data-i18n="setOvertimeThreshold">Weekly Overtime Threshold (hours)</label>
              <input type="number" id="setOvertimeThresholdVal" class="form-control" min="10" max="100" step="1" placeholder="40">
            </div>
          </div>

          <div style="margin-top: 2rem; display:flex; justify-content: flex-end;">
            <button type="submit" class="btn btn-primary">
              <span data-i18n="save">Save Settings</span>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/settings.js"></script>
</body>
</html>
