<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega Wash — Login</title>
  <meta name="description" content="Mega Wash employee and admin login portal.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-primary: #0A0A0A;
      --bg-secondary: #161617;
      --text-main: #F5F5F7;
      --text-muted: #86868B;
      --primary: #007AFF;
      --primary-hover: #1F8BFF;
      --glass-bg: rgba(22, 22, 23, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 20px 45px rgba(0,0,0,0.35);
      --border-radius: 20px;
    }

    body.light-mode {
      --bg-primary: #F5F5F7;
      --bg-secondary: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --primary: #0071E3;
      --primary-hover: #0077ED;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-shadow: 0 20px 45px rgba(0,0,0,0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      font-family: var(--font-family);
      min-height: 100vh;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.4s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius);
      padding: 3.5rem 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--glass-shadow);
      animation: appleSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes appleSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary), #5AC8FA);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
    }

    .logo-area .brand {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .logo-area .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      font-weight: 500;
    }

    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2rem;
    }

    .lang-btn {
      background: rgba(134, 134, 139, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 0.35rem 1rem;
      border-radius: 980px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: var(--font-family);
    }

    .lang-btn.active {
      background: var(--text-main);
      color: var(--bg-primary);
      border-color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-tertiary, rgba(134, 134, 139, 0.05));
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: var(--font-family);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .form-group input::placeholder { color: var(--text-muted); opacity: 0.5; }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      border: none;
      border-radius: 980px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-btn:hover {
      background-color: var(--primary-hover);
      transform: scale(1.02);
    }
    
    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: rgba(255, 59, 48, 0.12);
      border: 1px solid var(--danger);
      color: #ff453a;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 1.25rem;
      display: none;
      text-align: center;
      animation: appleSlideUp 0.3s ease;
    }

    body.light-mode .error-msg {
      color: #c92c24;
    }

    .footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.725rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: -0.1px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-card">

  <div class="logo-area">
    <div class="logo-icon">🚗</div>
    <div class="brand">Mega Wash</div>
    <div class="tagline" id="tagline">Employee & Admin Portal</div>
  </div>

  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" id="themeToggle" onclick="toggleTheme()" style="padding: 0.35rem 0.75rem;" title="Toggle Theme">☀️</button>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label id="label-username" for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             placeholder="admin / manager / employee" required>
    </div>

    <div class="form-group">
      <label id="label-password" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             placeholder="••••••••" required>
    </div>

    <button class="login-btn" id="loginBtn" type="submit">
      <span id="btnText">Sign In</span>
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </form>

  <div class="footer" id="footer-text">
    Mega Wash © 2026 · Montreal, QC · America/Toronto
  </div>
</div>

<script>
  // ── i18n ──────────────────────────────────────────────
  const T = {
    en: {
      tagline: 'Employee & Admin Portal',
      labelUser: 'Username',
      labelPass: 'Password',
      btnSign: 'Sign In',
      btnSigning: 'Signing in…',
      footer: 'Mega Wash © 2026 · Montreal, QC · America/Toronto'
    },
    fr: {
      tagline: 'Portail Employé & Administrateur',
      labelUser: 'Nom d\'utilisateur',
      labelPass: 'Mot de passe',
      btnSign: 'Se connecter',
      btnSigning: 'Connexion…',
      footer: 'Mega Wash © 2026 · Montréal, QC · America/Toronto'
    }
  };

  let lang = localStorage.getItem('mw_lang') || 'en';

  // ── Theme Management ──────────────────────────────────
  (function() {
    const savedTheme = localStorage.getItem('mw_theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
      document.documentElement.classList.add('light-mode');
      document.getElementById('themeToggle').textContent = '🌙';
    }
  })();

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    document.documentElement.classList.toggle('light-mode', isLight);
    localStorage.setItem('mw_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
  }

  function setLang(l) {
    lang = l;
    localStorage.setItem('mw_lang', l);
    const t = T[l];
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('label-username').textContent = t.labelUser;
    document.getElementById('label-password').textContent = t.labelPass;
    document.getElementById('btnText').textContent = t.btnSign;
    document.getElementById('footer-text').textContent = t.footer;
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
    document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
  }

  setLang(lang);

  // ── Auth ──────────────────────────────────────────────
  const storedUser = (() => {
    try { return JSON.parse(localStorage.getItem('carwash_user')); } catch { return null; }
  })();
  if (storedUser && localStorage.getItem('carwash_jwt')) {
    redirectByRole(storedUser.role);
  }

  function redirectByRole(role) {
    if (role === 'admin' || role === 'manager') {
      window.location.href = '/admin/dashboard.html';
    } else {
      window.location.href = '/employee/keypad.html';
    }
  }

  function parseJwt(token) {
    try {
      return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    } catch { return null; }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const btnText  = document.getElementById('btnText');
    const errBox   = document.getElementById('errorMsg');

    errBox.style.display = 'none';
    btn.disabled = true;
    btnText.innerHTML = `<span class="spinner"></span>${T[lang].btnSigning}`;

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || (lang === 'fr' ? 'Identifiants invalides.' : 'Invalid credentials.'));
      }

      localStorage.setItem('carwash_jwt', data.token);
      const claims = parseJwt(data.token) || data.user;
      localStorage.setItem('carwash_user', JSON.stringify(claims));
      redirectByRole(claims.role);

    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = T[lang].btnSign;
    }
  }
</script>
</body>
</html>
