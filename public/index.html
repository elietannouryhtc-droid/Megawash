<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Wash — Login</title>
  <meta name="description" content="Mega Wash employee and admin login portal.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-area img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 16px;
      background: rgba(255,255,255,0.1);
      padding: 8px;
      margin-bottom: 14px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .logo-area .brand {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .logo-area .tagline {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .lang-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .lang-btn.active {
      background: rgba(255,255,255,0.25);
      color: #ffffff;
      border-color: rgba(255,255,255,0.4);
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }

    .form-group input::placeholder { color: rgba(255,255,255,0.3); }

    .form-group input:focus {
      border-color: rgba(130,100,255,0.8);
      background: rgba(255,255,255,0.12);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }

    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(124,58,237,0.5); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-card">

  <div class="logo-area">
    <div class="brand">🚗 Mega Wash</div>
    <div class="tagline" id="tagline">Employee & Admin Portal</div>
  </div>

  <div class="lang-toggle" style="position: relative;">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">🇬🇧 EN</button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">🇫🇷 FR</button>
    <button class="lang-btn" id="themeToggle" onclick="toggleTheme()" style="padding: 5px 12px; margin-left: 6px;" title="Toggle Theme">☀️</button>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label id="label-username" for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             placeholder="admin / manager / employee" required>
    </div>

    <div class="form-group">
      <label id="label-password" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             placeholder="••••••••" required>
    </div>

    <button class="login-btn" id="loginBtn" type="submit">
      <span id="btnText">Sign In</span>
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </form>

  <div class="footer" id="footer-text">
    Mega Wash © 2026 · Montreal, QC · America/Toronto
  </div>
</div>

<script>
  // ── i18n ──────────────────────────────────────────────
  const T = {
    en: {
      tagline: 'Employee & Admin Portal',
      labelUser: 'Username',
      labelPass: 'Password',
      btnSign: 'Sign In',
      btnSigning: 'Signing in…',
      footer: 'Mega Wash © 2026 · Montreal, QC · America/Toronto'
    },
    fr: {
      tagline: 'Portail Employé & Administrateur',
      labelUser: 'Nom d\'utilisateur',
      labelPass: 'Mot de passe',
      btnSign: 'Se connecter',
      btnSigning: 'Connexion…',
      footer: 'Mega Wash © 2026 · Montréal, QC · America/Toronto'
    }
  };

  let lang = localStorage.getItem('mw_lang') || 'en';

  // ── Theme Management ──────────────────────────────────
  (function() {
    const savedTheme = localStorage.getItem('mw_theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
      document.documentElement.classList.add('light-mode');
      document.getElementById('themeToggle').textContent = '🌙';
    }
  })();

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    document.documentElement.classList.toggle('light-mode', isLight);
    localStorage.setItem('mw_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀️';
  }

  function setLang(l) {
    lang = l;
    localStorage.setItem('mw_lang', l);
    const t = T[l];
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('label-username').textContent = t.labelUser;
    document.getElementById('label-password').textContent = t.labelPass;
    document.getElementById('btnText').textContent = t.btnSign;
    document.getElementById('footer-text').textContent = t.footer;
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
    document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
  }

  setLang(lang);

  // ── Auth ──────────────────────────────────────────────
  // If already logged in, redirect immediately
  const storedUser = (() => {
    try { return JSON.parse(localStorage.getItem('carwash_user')); } catch { return null; }
  })();
  if (storedUser && localStorage.getItem('carwash_jwt')) {
    redirectByRole(storedUser.role);
  }

  function redirectByRole(role) {
    if (role === 'admin' || role === 'manager') {
      window.location.href = '/admin/dashboard.html';
    } else {
      window.location.href = '/employee/keypad.html';
    }
  }

  function parseJwt(token) {
    try {
      return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    } catch { return null; }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const btnText  = document.getElementById('btnText');
    const errBox   = document.getElementById('errorMsg');

    errBox.style.display = 'none';
    btn.disabled = true;
    btnText.innerHTML = `<span class="spinner"></span>${T[lang].btnSigning}`;

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || (lang === 'fr' ? 'Identifiants invalides.' : 'Invalid credentials.'));
      }

      localStorage.setItem('carwash_jwt', data.token);
      const claims = parseJwt(data.token) || data.user;
      localStorage.setItem('carwash_user', JSON.stringify(claims));
      redirectByRole(claims.role);

    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = T[lang].btnSign;
    }
  }
</script>
</body>
</html>
